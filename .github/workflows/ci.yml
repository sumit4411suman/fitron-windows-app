name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitron_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      # The same tests against the Local Windows Edition's SQLite database (docs/local-windows/DATABASE-MIGRATION.md).
      - run: npm run test:local
      - run: npm run build
      # The end-to-end tests drive a real browser against the production build just made (see e2e/ and the README).
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Cloud sync end to end: fitron.in and FITRON for Windows as two servers from the same build, on a database of
      # their own (scripts/e2e-sync.ts), with a connection that is cut and dropped on purpose.
      - run: npm run e2e:sync
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
