name: WhatsApp connector

on:
  push:
    branches: [main]
    paths: ["whatsapp-connector/**", ".github/workflows/whatsapp-connector.yml"]
  pull_request:
    paths: ["whatsapp-connector/**", ".github/workflows/whatsapp-connector.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-connector
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wa_test
        ports: ["5440:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6390:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5440/wa_test
      REDIS_URL: redis://127.0.0.1:6390
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whatsapp-connector/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - name: Docker image builds
        run: docker build -t wa-connector:ci .
