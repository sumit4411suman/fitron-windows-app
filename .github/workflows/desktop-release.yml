name: Desktop release (Windows)

# A release of FITRON Gym Accounting for Windows (docs/local-windows/RELEASE.md, Phase 25). Run by hand from the Actions
# tab, on main. It builds the program and installer with FITRON's update key (always) and FITRON's Authenticode
# certificate (when FITRON_SIGN_PROVIDER names one; without it the installer is not code-signed and Windows shows
# "Unknown publisher"), checks the signatures as Windows sees them (npm run desktop:signature, --require when signed),
# runs the same start, install, update and uninstall tests as every build, and puts the installer, its checksum and the
# update feed in a DRAFT GitHub release. A draft reaches no gym: FITRON only reads the newest published release. Test
# the draft's installer by hand, then press Publish on it; that is what sends the update to every installed FITRON.
#
# Set up once, in the repository's Settings > Environments > "release" (protected: only the people allowed to release).
# The certificate's private key never leaves its signing service; nothing secret is ever in the repository.
#
#   variable  FITRON_SIGN_PROVIDER   none (the default: no code-signing certificate), or esigner (SSL.com eSigner),
#                                    keylocker (DigiCert KeyLocker) or pfx (a .pfx file)
#   variable  FITRON_PUBLISHER       with a certificate: the organisation name on it, e.g. "FITRON Technologies Private Limited"
#   secret    TAURI_SIGNING_PRIVATE_KEY           FITRON's update key (made with: npx tauri signer generate)
#   secret    TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   variable  FITRON_UPDATE_PUBKEY   the update key's public half, built into the program
#   variable  FITRON_UPDATE_URL      optional: where latest.json is served. Default: this repository's GitHub Releases,
#                                    https://github.com/<owner>/<repo>/releases/latest/download/latest.json
#
#   esigner:   secrets ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_TOTP_SECRET (the eSigner account's sign-in and the
#              secret behind its authenticator code, from SSL.com's "automated signing" setup)
#   keylocker: secrets SM_API_KEY, SM_CLIENT_CERT_FILE_B64 (the client authentication certificate, .p12, base64),
#              SM_CLIENT_CERT_PASSWORD, SM_CODE_SIGNING_CERT_SHA1_HASH (the code-signing certificate's thumbprint);
#              variable SM_HOST (default https://clientauth.one.digicert.com)
#   pfx:       secrets FITRON_SIGN_PFX_BASE64, FITRON_SIGN_PFX_PASSWORD
#
# Missing settings stop the release at once, naming each. Updates are always signed with FITRON's update key, so only
# FITRON can publish one. It never asks anyone to turn SmartScreen off.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (shown in FITRON's update dialog and on the release page)
        required: true

permissions:
  contents: write # the draft release; nothing else

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    env:
      PROVIDER: ${{ vars.FITRON_SIGN_PROVIDER || 'none' }}
      FITRON_PUBLISHER: ${{ vars.FITRON_PUBLISHER || 'FITRON' }}
      FITRON_UPDATE_URL: ${{ vars.FITRON_UPDATE_URL || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
      FITRON_UPDATE_PUBKEY: ${{ vars.FITRON_UPDATE_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the release settings are all there
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          FITRON_SIGN_PFX_BASE64: ${{ secrets.FITRON_SIGN_PFX_BASE64 }}
          FITRON_SIGN_PFX_PASSWORD: ${{ secrets.FITRON_SIGN_PFX_PASSWORD }}
        run: |
          if ($env:REF -ne "refs/heads/main") { Write-Output "::error::Releases are built from main (this run is on $env:REF). Pick main under 'Use workflow from'."; exit 1 }
          $missing = @()
          if (-not $env:UPDATE_KEY) { $missing += "secret TAURI_SIGNING_PRIVATE_KEY" }
          if (-not $env:FITRON_UPDATE_PUBKEY) { $missing += "variable FITRON_UPDATE_PUBKEY" }
          if (-not $env:FITRON_UPDATE_URL.StartsWith("https://")) { $missing += "variable FITRON_UPDATE_URL (must be https)" }
          $need = @{
            none      = @()
            esigner   = @("ESIGNER_USERNAME", "ESIGNER_PASSWORD", "ESIGNER_TOTP_SECRET")
            keylocker = @("SM_API_KEY", "SM_CLIENT_CERT_FILE_B64", "SM_CLIENT_CERT_PASSWORD", "SM_CODE_SIGNING_CERT_SHA1_HASH")
            pfx       = @("FITRON_SIGN_PFX_BASE64", "FITRON_SIGN_PFX_PASSWORD")
          }
          if (-not $need.ContainsKey("$env:PROVIDER")) { $missing += "variable FITRON_SIGN_PROVIDER (none, esigner, keylocker or pfx)" }
          else { foreach ($n in $need["$env:PROVIDER"]) { if (-not (Get-Item "env:$n" -ErrorAction SilentlyContinue).Value) { $missing += "secret $n" } } }
          if ($missing.Count) { Write-Output "::error::Not set in the release environment: $($missing -join ', '). (docs/local-windows/RELEASE.md)"; exit 1 }
          if ($env:PROVIDER -eq "none") { Write-Output "::warning::No code-signing certificate (FITRON_SIGN_PROVIDER is none): the installer is not code-signed, so Windows shows 'Unknown publisher' and SmartScreen warns before the first install. Updates are still signed with FITRON's update key." }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "::error::A release v$version already exists (published or draft). Raise the version in package.json, or delete that draft."; exit 1 }
          "FITRON_VERSION=$version" >> $env:GITHUB_ENV
          Write-Output "Release v$version, code signing: $env:PROVIDER, updates from $env:FITRON_UPDATE_URL"
          exit 0 # the lookup above failing is the good case; it must not become this step's exit code

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Put signtool on the PATH (Windows SDK)
        if: env.PROVIDER != 'none'
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { Write-Output "::error::signtool.exe not found (Windows SDK)"; exit 1 }
          $st.DirectoryName >> $env:GITHUB_PATH

      # With a certificate, one of the next three steps runs, by FITRON_SIGN_PROVIDER. Each ends with FITRON's certificate
      # in this runner's Windows store, its private key still in the signing service, and FITRON_SIGN_THUMBPRINT naming it.

      - name: "Signing service: SSL.com eSigner (Cloud Key Adapter)"
        if: env.PROVIDER == 'esigner'
        shell: pwsh
        env:
          ESIGNER_CKA_VERSION: 1.0.8
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "eSignerCKA"
          $zip = Join-Path $env:RUNNER_TEMP "eSignerCKA.zip"
          Invoke-WebRequest -OutFile $zip "https://github.com/SSLcom/eSignerCKA/releases/download/v$env:ESIGNER_CKA_VERSION/SSL.COM-eSigner-CKA_$env:ESIGNER_CKA_VERSION.zip"
          Expand-Archive -Force $zip (Join-Path $env:RUNNER_TEMP "eSignerCKA-setup")
          $setup = Get-ChildItem (Join-Path $env:RUNNER_TEMP "eSignerCKA-setup") -Recurse -Filter *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /DIR=`"$dir`"" -Wait
          $tool = Join-Path $dir "eSignerCKATool.exe"
          & $tool config -mode product -user "$env:ESIGNER_USERNAME" -pass "$env:ESIGNER_PASSWORD" -totp "$env:ESIGNER_TOTP_SECRET" -key (Join-Path $dir "master.key") -r
          & $tool unload
          & $tool load
          $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
          if (-not $cert) { Write-Output "::error::eSigner loaded no code-signing certificate. Check the account, and that automated signing (TOTP) is enabled for it."; exit 1 }
          "FITRON_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "FITRON_SIGN_TIMESTAMP_URL=http://ts.ssl.com" >> $env:GITHUB_ENV
          "ESIGNER_TOOL=$tool" >> $env:GITHUB_ENV

      - name: "Signing service: DigiCert KeyLocker (key storage provider)"
        if: env.PROVIDER == 'keylocker'
        shell: pwsh
        env:
          SM_HOST: ${{ vars.SM_HOST || 'https://clientauth.one.digicert.com' }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          $p12 = Join-Path $env:RUNNER_TEMP "sm-client.p12"
          [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          # The KeyLocker tools read these from the environment for every signature made in later steps.
          "SM_HOST=$env:SM_HOST" >> $env:GITHUB_ENV
          "SM_CLIENT_CERT_FILE=$p12" >> $env:GITHUB_ENV
          $msi = Join-Path $env:RUNNER_TEMP "Keylockertools-windows-x64.msi"
          Invoke-WebRequest -OutFile $msi -Headers @{ "x-api-key" = $env:SM_API_KEY } "https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download"
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /qn" -Wait
          $tools = "C:\Program Files\DigiCert\DigiCert Keylocker Tools"
          $tools >> $env:GITHUB_PATH
          $env:SM_CLIENT_CERT_FILE = $p12
          & "$tools\smksp_registrar.exe" register
          & "$tools\smctl.exe" healthcheck
          & "$tools\smksp_cert_sync.exe"
          $thumb = $env:SM_CODE_SIGNING_CERT_SHA1_HASH.Replace(" ", "").ToUpper()
          if (-not (Get-ChildItem Cert:\CurrentUser\My, Cert:\LocalMachine\My | Where-Object Thumbprint -eq $thumb)) { Write-Output "::error::KeyLocker did not put the certificate $thumb in a Windows store. Check SM_CODE_SIGNING_CERT_SHA1_HASH and the API key's access."; exit 1 }
          "FITRON_SIGN_THUMBPRINT=$thumb" >> $env:GITHUB_ENV
          "FITRON_SIGN_TIMESTAMP_URL=http://timestamp.digicert.com" >> $env:GITHUB_ENV

      - name: "Signing certificate: a .pfx file"
        if: env.PROVIDER == 'pfx'
        shell: pwsh
        env:
          PFX: ${{ secrets.FITRON_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.FITRON_SIGN_PFX_PASSWORD }}
        run: |
          $file = Join-Path $env:RUNNER_TEMP "fitron-sign.pfx"
          [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:PFX))
          try {
            $cert = Import-PfxCertificate -FilePath $file -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          } finally {
            Remove-Item $file -Force
          }
          "FITRON_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: One test signature, before the long build
        if: env.PROVIDER != 'none'
        shell: pwsh
        run: |
          # Signs a copy of a small Windows program exactly as the build will sign FITRON's files, and checks it as
          # Windows sees it, so a wrong setting fails here in a minute rather than after the build.
          $probe = Join-Path $env:RUNNER_TEMP "fitron-sign-probe.exe"
          Copy-Item "$env:WINDIR\System32\where.exe" $probe
          cmd /c scripts\desktop\fitron-sign.cmd "$probe"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::The test signature failed (see above)."; exit 1 }
          $s = Get-AuthenticodeSignature -LiteralPath $probe
          Write-Output "Signed by: $($s.SignerCertificate.Subject)"
          Write-Output "Timestamp: $($s.TimeStamperCertificate.Subject)"
          if ($s.Status -ne "Valid" -or -not $s.TimeStamperCertificate) { Write-Output "::error::The test signature is $($s.Status)$(if (-not $s.TimeStamperCertificate) { ', without a timestamp' })."; exit 1 }
          if ($s.SignerCertificate.Subject -notlike "*$env:FITRON_PUBLISHER*") { Write-Output "::error::The certificate is for '$($s.SignerCertificate.Subject)', not FITRON_PUBLISHER '$env:FITRON_PUBLISHER'."; exit 1 }

      - name: Package the server with this Node.js, and check it
        run: npm run desktop:bundle
      - name: Build, with signed update files (and Authenticode, with a certificate)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # The build checks the update signature it makes against the updater's public key in the config, which
          # tauri.conf.json leaves empty (the program reads FITRON_UPDATE_PUBKEY itself): give the build the same key.
          $keyConf = Join-Path $env:RUNNER_TEMP "tauri.updater-key.conf.json"
          @{ plugins = @{ updater = @{ pubkey = $env:FITRON_UPDATE_PUBKEY.Trim() } } } | ConvertTo-Json -Depth 5 -Compress | Out-File -Encoding utf8NoBOM $keyConf
          $configs = @("--config", "src-tauri/tauri.bundle.conf.json", "--config", "src-tauri/tauri.release.conf.json", "--config", $keyConf)
          if ($env:PROVIDER -ne "none") { $configs += @("--config", "src-tauri/tauri.sign.conf.json") }
          npx tauri build @configs
      - name: Name the installer and write its checksum
        run: npm run desktop:installer
      - name: Signatures as Windows sees them (with a certificate, every file signed by FITRON and timestamped)
        shell: pwsh
        run: |
          if ($env:PROVIDER -eq "none") { npm run desktop:signature } else { npm run desktop:signature -- --require }
      - name: Start, close and end the desktop program
        run: npm run desktop:smoke
      - name: Install, update and uninstall as a customer does
        run: npm run desktop:installer-test
      - name: The update feed
        shell: pwsh
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          $env:NOTES | Out-File -Encoding utf8 RELEASE-NOTES.md
          npm run desktop:release -- --notes-file RELEASE-NOTES.md

      - name: Draft GitHub release (reaches no gym until published)
        shell: pwsh
        run: |
          $d = "dist/desktop"
          $name = "FITRON-Gym-Accounting-Setup-$env:FITRON_VERSION.exe"
          $installer = "$d/$name"
          # The release page: the notes, then how to check the download (the update dialog shows the notes alone).
          $sha = (Get-Content "$installer.sha256" -Raw).Split(" ")[0]
          $body = @((Get-Content RELEASE-NOTES.md -Raw).TrimEnd(), "", "## Installing", "")
          if ($env:PROVIDER -eq "none") {
            $body += "This installer is not code-signed, so Windows shows **Unknown publisher** and SmartScreen says ""Windows protected your PC"" before the first install. Download it only from this page, check its SHA-256 below (PowerShell: ``Get-FileHash $name``), then choose **More info › Run anyway**. Never turn SmartScreen off. Once installed, FITRON updates itself, and only installs an update signed with FITRON's update key."
          } else {
            $body += "Windows shows **$env:FITRON_PUBLISHER** as the verified publisher. If it shows ""Unknown publisher"", the file is not FITRON's: do not run it."
          }
          $body += @("", "SHA-256 of ``$name``: ``$sha``")
          $body -join "`n" | Out-File -Encoding utf8 RELEASE-BODY.md
          gh release create "v$env:FITRON_VERSION" --draft --target "$env:GITHUB_SHA" --title "FITRON Gym Accounting $env:FITRON_VERSION" --notes-file RELEASE-BODY.md $installer "$installer.sha256" "$d/latest.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "::notice::Draft release v$env:FITRON_VERSION made. Install it by hand on a clean Windows 10 and 11, then press Publish on the release to send the update to every FITRON."

      - name: Remove the signing setup from the runner
        if: always()
        shell: pwsh
        run: |
          if ($env:PROVIDER -eq "pfx" -and $env:FITRON_SIGN_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:FITRON_SIGN_THUMBPRINT" -ErrorAction SilentlyContinue }
          if ($env:ESIGNER_TOOL) { & $env:ESIGNER_TOOL unload; Remove-Item (Join-Path (Split-Path $env:ESIGNER_TOOL) "master.key") -Force -ErrorAction SilentlyContinue }
          if ($env:SM_CLIENT_CERT_FILE) { Remove-Item $env:SM_CLIENT_CERT_FILE -Force -ErrorAction SilentlyContinue }
          exit 0
      - name: Keep the release files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FITRON-Gym-Accounting-release
          path: dist/desktop/
          if-no-files-found: ignore
          retention-days: 30
