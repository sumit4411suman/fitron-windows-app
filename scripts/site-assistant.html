<aside class="fa" id="fitronAssistant" aria-label="Fitron Assistant" hidden>
<button type="button" class="fa-launcher" aria-label="Open Fitron Assistant chat" aria-expanded="false" aria-controls="faPanel"><img src="/fitron-mark-v2.png" alt="" width="32" height="32" loading="lazy" decoding="async"><span>Fitron Assistant</span></button>
<section class="fa-panel" id="faPanel" role="dialog" aria-label="Fitron Assistant chat" tabindex="-1" hidden>
<div class="fa-head"><img src="/fitron-mark-v2.png" alt="" width="40" height="40" loading="lazy" decoding="async"><div class="fa-title"><b>Fitron Assistant</b><span>Ask about plans, pricing and features</span></div><button type="button" class="fa-close" aria-label="Close chat"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg></button></div>
<div class="fa-log" role="log" aria-live="polite" aria-label="Conversation" tabindex="0">
<div class="fa-msg fa-bot"><p>Hi! I'm Fitron Assistant. Ask me about the AI Trainer, Gym Accounting, prices or your free trial.</p></div>
<div class="fa-chips"><button type="button" class="fa-chip" data-q="How much does it cost?">How much does it cost?</button><button type="button" class="fa-chip" data-q="How does the free trial work?">How does the free trial work?</button><button type="button" class="fa-chip" data-q="What's the difference between your products?">What's the difference between your products?</button><button type="button" class="fa-chip" data-q="Talk to a person">Talk to a person</button></div>
</div>
<div class="fa-foot">
<form class="fa-form" novalidate><label class="fa-sr" for="faInput">Your message</label><textarea class="fa-input" id="faInput" rows="1" maxlength="500" placeholder="Type your question" enterkeyhint="send" autocomplete="off"></textarea><button type="submit" class="fa-send" aria-label="Send message"><svg class="icon" aria-hidden="true"><use href="#i-arrow"></use></svg></button></form>
<p class="fa-note">Answers are written by AI and can be wrong. Don't share passwords, card numbers or OTPs. <a href="/privacy#sharing">Privacy</a></p>
</div>
</section>
</aside>
